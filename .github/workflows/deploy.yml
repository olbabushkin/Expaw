name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск из вкладки Actions

# Не запускаем два деплоя параллельно
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/expaw

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q common db userbot bot worker

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        # .env, data/ (postgres + session) и .git на сервере не трогаем
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            --exclude '.env' \
            --exclude 'data' \
            --exclude '.git' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      - name: Build & restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        # compose сам прогонит migrate (idempotent) и пересоздаст только изменившиеся сервисы
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_DIR && docker compose up -d --build && docker image prune -f"

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          sleep 10
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_DIR && docker compose ps --format 'table {{.Service}}\t{{.Status}}' \
             && [ -z \"\$(docker compose ps --status exited --services | grep -v '^migrate\$')\" ]"
